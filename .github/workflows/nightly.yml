name: Source checks

# Runs source tests on app changes, nightly at 02:00 UTC, or on demand.
# This workflow does not upload build or test artifacts.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/nightly.yml"

permissions:
  contents: read

concurrency:
  group: nightly-source-checks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android API 37
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'"

      # The runner image no longer ships the NDK version pinned in
      # app/build.gradle.kts, and AGP refuses to configure without it.
      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
